<rect x="945" y="205" width="170" height="80" rx="8" fill="#08283a" stroke="#00f5ff" stroke-width="3"><animate attributeName="stroke-opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></rect>
<text x="1030" y="238" text-anchor="middle" class="s t">WAZUH SERVER</text>
<text x="1030" y="256" text-anchor="middle" class="m r" fill="#00f5ff">MANAGER · DASHBOARD</text>
<text x="1030" y="272" text-anchor="middle" class="m r" fill="#8fd3ff">RULES · DECODERS</text>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.55;.6;.9;1" dur="3.2s" repeatCount="indefinite"/><rect x="1070" y="190" width="64" height="20" rx="4" fill="#ff4d6d"/><text x="1102" y="204" text-anchor="middle" class="m" font-size="11" fill="#fff" letter-spacing="2">ALERT</text></g>
<circle r="5" fill="#ff4d6d" filter="url(#gl)"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#aA"/></animateMotion></circle>
