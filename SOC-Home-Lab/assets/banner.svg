<linearGradient id="sc" x1="0" x2="1"><stop offset="0" stop-color="#00f5ff" stop-opacity="0"/><stop offset="1" stop-color="#00f5ff" stop-opacity=".22"/></linearGradient>
<filter id="gl" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<path id="aA" d="M190 245H545V200H635"/>
<path id="aB" d="M190 245H545V290H635"/>
<path id="tA" d="M765 200H855V245H945"/>
<path id="tB" d="M765 290H855V245H945"/>
