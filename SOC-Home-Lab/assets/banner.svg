<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="SOC Home Lab banner">
<style>
.m{font-family:Consolas,'Courier New',monospace}
.s{font-family:'Segoe UI','Arial Black',Verdana,sans-serif;font-weight:800}
.t{font-size:15px;fill:#fff}
.r{font-size:10px;letter-spacing:1.5px}
.k{font-size:12px;fill:#6fa8cc;letter-spacing:2px}
.v{font-size:12px;fill:#fff;letter-spacing:1px}
.g{fill:#39ff14}
</style>
<defs>
