<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Phishing Email Analysis banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0508"/>
      <stop offset="1" stop-color="#1c0a12"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b3b"/>
      <stop offset="0.6" stop-color="#ff8a3b"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <g fill="none" stroke="#ff3b3b" stroke-width="2" stroke-opacity="0.85">
    <path d="M18 54V18H54"/><path d="M1182 54V18H1146"/>
    <path d="M18 246V282H54"/><path d="M1182 246V282H1146"/>
  </g>

  <g font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="3">
    <circle cx="70" cy="38" r="5" fill="#ff3b3b">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <text x="86" y="43" fill="#ff3b3b">INBOX TRIAGE</text>
    <text x="230" y="43" fill="#8a6a70">//  SUSPICIOUS MESSAGE UNDER ANALYSIS</text>
  </g>

  <text x="60" y="104" font-family="'Segoe UI', 'Arial Black', Verdana, sans-serif" font-size="52" font-weight="800"
        fill="url(#title)" filter="url(#glow)" textLength="780" lengthAdjust="spacingAndGlyphs">PHISHING EMAIL ANALYSIS</text>
  <text x="62" y="136" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#c9a9b0"
        textLength="780" lengthAdjust="spacing">HEADERS  ×  URLS  ×  ATTACHMENTS  ×  IOCs  ×  VERDICT</text>

  <rect x="60" y="154" width="720" height="124" rx="8" fill="#12080c" stroke="#ff3b3b" stroke-opacity="0.55"/>
  <rect x="60" y="154" width="720" height="22" rx="8" fill="#2a0f16"/>
  <circle cx="78" cy="165" r="3.5" fill="#ff5f56"/><circle cx="92" cy="165" r="3.5" fill="#ffbd2e"/><circle cx="106" cy="165" r="3.5" fill="#27c93f"/>
  <text x="130" y="169" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#8a6a70">RAW MESSAGE VIEW</text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.06;0.1;0.93;1" dur="9s" repeatCount="indefinite"/>
    <text x="84" y="192" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#8a6a70">From:</text>
    <text x="176" y="192" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#f1e4e7">Account Security &lt;no-reply@secure-login.example&gt;</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.13;0.17;0.93;1" dur="9s" repeatCount="indefinite"/>
    <text x="84" y="214" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#8a6a70">Reply-To:</text>
    <text x="176" y="214" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#ffb703">collector@mailbox-drop.example   &lt;&lt; MISMATCH</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.24;0.93;1" dur="9s" repeatCount="indefinite"/>
    <text x="84" y="236" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#8a6a70">Subject:</text>
    <text x="176" y="236" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#f1e4e7">Urgent: verify your account within 24 hours</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.27;0.31;0.93;1" dur="9s" repeatCount="indefinite"/>
    <text x="84" y="258" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#8a6a70">Link:</text>
    <text x="176" y="258" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#ff3b3b">hxxps://secure-login[.]example/verify</text>
  </g>
  <rect x="60" y="154" width="720" height="2" fill="#ff3b3b" fill-opacity="0.6">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 122" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(985 188) rotate(-10)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.6;0.93;1" dur="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1.8;1.8;1;1;1" keyTimes="0;0.55;0.6;0.93;1" dur="9s" repeatCount="indefinite"/>
      <rect x="-140" y="-40" width="280" height="80" rx="10" fill="none" stroke="#ff3b3b" stroke-width="5"/>
      <rect x="-130" y="-30" width="260" height="60" rx="6" fill="none" stroke="#ff3b3b" stroke-width="1.5" stroke-opacity="0.7"/>
      <text x="-110" y="14" font-family="'Segoe UI', 'Arial Black', Verdana, sans-serif" font-size="42" font-weight="800" fill="#ff3b3b" filter="url(#glow)" textLength="220" lengthAdjust="spacingAndGlyphs">PHISHING</text>
    </g>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.71;0.93;1" dur="9s" repeatCount="indefinite"/>
    <rect x="838" y="244" width="94" height="28" rx="5" fill="#2a0a10" stroke="#ff3b3b"/>
    <text x="885" y="263" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="1" fill="#ff3b3b">SPF  ✗</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.73;0.76;0.93;1" dur="9s" repeatCount="indefinite"/>
    <rect x="942" y="244" width="94" height="28" rx="5" fill="#2a0a10" stroke="#ff3b3b"/>
    <text x="989" y="263" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="1" fill="#ff3b3b">DKIM  ✗</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.78;0.81;0.93;1" dur="9s" repeatCount="indefinite"/>
    <rect x="1046" y="244" width="94" height="28" rx="5" fill="#2a0a10" stroke="#ff3b3b"/>
    <text x="1093" y="263" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="1" fill="#ff3b3b">DMARC  ✗</text>
  </g>
</svg>
