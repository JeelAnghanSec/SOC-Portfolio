<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="SOC Portfolio banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060b"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c"/>
      <stop offset="0.25" stop-color="#ffb703"/>
      <stop offset="0.5" stop-color="#9b5cff"/>
      <stop offset="0.75" stop-color="#ff3b3b"/>
      <stop offset="1" stop-color="#00c8ff"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00c8ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="tick"><rect x="60" y="276" width="1080" height="28" rx="6"/></clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.55">
    <path d="M18 54V18H54"/><path d="M1182 54V18H1146"/>
    <path d="M18 266V302H54"/><path d="M1182 266V302H1146"/>
  </g>

  <g font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="3">
    <text x="60" y="40" fill="#00c8ff">SOC // COMMAND CENTER</text>
    <circle cx="960" cy="36" r="4" fill="#39ff14">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="1140" y="40" fill="#39ff14" text-anchor="end">ALL CHANNELS ONLINE</text>
  </g>

  <text x="60" y="108" font-family="'Segoe UI', Arial, Verdana, sans-serif" font-size="66" font-weight="800" fill="url(#title)">SOC PORTFOLIO</text>
  <text x="62" y="142" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="1" fill="#9fb3d9">JEEL ANGHAN  |  ASPIRING SOC ANALYST  |  BLUE TEAM  |  DFIR  |  DETECTION ENGINEERING</text>

  <!-- emblem -->
  <g>
    <circle cx="1000" cy="96" r="58" fill="none" stroke="#00c8ff" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="0 1000 96" to="360 1000 96" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="96" r="46" fill="none" stroke="#9b5cff" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="360 1000 96" to="0 1000 96" dur="14s" repeatCount="indefinite"/>
    </circle>
    <path d="M1000 66 L1024 76 V100 C1024 116 1012 126 1000 132 C988 126 976 116 976 100 V76 Z" fill="#0a1020" stroke="#00c8ff" stroke-width="2"/>
    <text x="1000" y="107" text-anchor="middle" font-family="'Segoe UI', Arial, Verdana, sans-serif" font-size="17" font-weight="800" fill="#00c8ff">SOC</text>
  </g>

  <!-- card 1 -->
  <g>
    <rect x="60" y="170" width="200" height="88" rx="8" fill="#0a0f1a" stroke="#00ff9c" stroke-opacity="0.7"/>
    <rect x="60" y="170" width="200" height="3" rx="1.5" fill="#00ff9c"/>
    <text x="74" y="194" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#00ff9c">01 | SIEM</text>
    <circle cx="242" cy="190" r="4" fill="#00ff9c"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="74" y="218" font-family="'Segoe UI', Arial, Verdana, sans-serif" font-size="20" font-weight="800" fill="#ffffff">SPLUNK</text>
    <path d="M74 242 l30 0 l8 -12 l8 22 l8 -26 l8 16 l8 0 l40 0 l8 -10 l8 14 l20 0" fill="none" stroke="#00ff9c" stroke-opacity="0.25" stroke-width="2"/>
  </g>
  <!-- card 2 -->
  <g>
    <rect x="280" y="170" width="200" height="88" rx="8" fill="#0a0f1a" stroke="#ffb703" stroke-opacity="0.7"/>
    <rect x="280" y="170" width="200" height="3" rx="1.5" fill="#ffb703"/>
    <text x="294" y="194" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#ffb703">02 | NETWORK</text>
    <circle cx="462" cy="190" r="4" fill="#ffb703"><animate attributeName="opacity" values="1;0.2;1" dur="1.45s" repeatCount="indefinite"/></circle>
    <text x="294" y="218" font-family="'Segoe UI', Arial, Verdana, sans-serif" font-size="20" font-weight="800" fill="#ffffff">PCAP</text>
    <path d="M294 242 l30 0 l8 -12 l8 22 l8 -26 l8 16 l8 0 l40 0 l8 -10 l8 14 l20 0" fill="none" stroke="#ffb703" stroke-opacity="0.25" stroke-width="2"/>
  </g>
  <!-- card 3 -->
  <g>
    <rect x="500" y="170" width="200" height="88" rx="8" fill="#0a0f1a" stroke="#9b5cff" stroke-opacity="0.7"/>
    <rect x="500" y="170" width="200" height="3" rx="1.5" fill="#9b5cff"/>
    <text x="514" y="194" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#9b5cff">03 | MEMORY</text>
    <circle cx="682" cy="190" r="4" fill="#9b5cff"><animate attributeName="opacity" values="1;0.2;1" dur="1.7s" repeatCount="indefinite"/></circle>
    <text x="514" y="218" font-family="'Segoe UI', Arial, Verdana, sans-serif" font-size="20" font-weight="800" fill="#ffffff">VOLATILITY</text>
    <path d="M514 242 l30 0 l8 -12 l8 22 l8 -26 l8 16 l8 0 l40 0 l8 -10 l8 14 l20 0" fill="none" stroke="#9b5cff" stroke-opacity="0.25" stroke-width="2"/>
  </g>
  <!-- card 4 -->
  <g>
    <rect x="720" y="170" width="200" height="88" rx="8" fill="#0a0f1a" stroke="#ff3b3b" stroke-opacity="0.7"/>
    <rect x="720" y="170" width="200" height="3" rx="1.5" fill="#ff3b3b"/>
    <text x="734" y="194" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#ff3b3b">04 | EMAIL</text>
    <circle cx="902" cy="190" r="4" fill="#ff3b3b"><animate attributeName="opacity" values="1;0.2;1" dur="1.95s" repeatCount="indefinite"/></circle>
    <text x="734" y="218" font-family="'Segoe UI', Arial, Verdana, sans-serif" font-size="20" font-weight="800" fill="#ffffff">PHISHING</text>
    <path d="M734 242 l30 0 l8 -12 l8 22 l8 -26 l8 16 l8 0 l40 0 l8 -10 l8 14 l20 0" fill="none" stroke="#ff3b3b" stroke-opacity="0.25" stroke-width="2"/>
  </g>
  <!-- card 5 -->
  <g>
    <rect x="940" y="170" width="200" height="88" rx="8" fill="#0a0f1a" stroke="#00c8ff" stroke-opacity="0.7"/>
    <rect x="940" y="170" width="200" height="3" rx="1.5" fill="#00c8ff"/>
    <text x="954" y="194" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#00c8ff">05 | ENDPOINT</text>
    <circle cx="1122" cy="190" r="4" fill="#00c8ff"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <text x="954" y="218" font-family="'Segoe UI', Arial, Verdana, sans-serif" font-size="20" font-weight="800" fill="#ffffff">WAZUH</text>
    <path d="M954 242 l30 0 l8 -12 l8 22 l8 -26 l8 16 l8 0 l40 0 l8 -10 l8 14 l20 0" fill="none" stroke="#00c8ff" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <!-- ticker -->
  <rect x="60" y="276" width="1080" height="28" rx="6" fill="#070b14" stroke="#1d2740"/>
  <g clip-path="url(#tick)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1500 0" dur="28s" repeatCount="indefinite"/>
      <text x="70" y="295" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8fa3c8" textLength="1500" lengthAdjust="spacing">*  01 SPLUNK: 2 CASES CLOSED  //  02 PCAP: 2 CASES CLOSED  //  03 MEMORY: 2 CASES CLOSED  //  04 PHISHING: 2 CASES CLOSED  //  05 HOME LAB: WAZUH ONLINE  //  STATUS: HUNTING MODE ENGAGED  //</text>
      <text x="1570" y="295" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8fa3c8" textLength="1500" lengthAdjust="spacing">*  01 SPLUNK: 2 CASES CLOSED  //  02 PCAP: 2 CASES CLOSED  //  03 MEMORY: 2 CASES CLOSED  //  04 PHISHING: 2 CASES CLOSED  //  05 HOME LAB: WAZUH ONLINE  //  STATUS: HUNTING MODE ENGAGED  //</text>
    </g>
  </g>

  <rect x="-60" y="0" width="60" height="320" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1260 0" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
