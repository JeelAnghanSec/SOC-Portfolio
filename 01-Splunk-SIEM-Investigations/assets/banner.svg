<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="SIEM Investigations banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060c"/>
      <stop offset="1" stop-color="#0c1224"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c"/>
      <stop offset="0.55" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="sweepg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00c8ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="typeclip">
      <rect x="272" y="212" width="0" height="32">
        <animate attributeName="width" values="0;480;480;0" keyTimes="0;0.55;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- corner brackets -->
  <g fill="none" stroke="#00c8ff" stroke-width="2" stroke-opacity="0.8">
    <path d="M18 54V18H54"/>
    <path d="M1182 54V18H1146"/>
    <path d="M18 246V282H54"/>
    <path d="M1182 246V282H1146"/>
  </g>

  <!-- status line -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="3">
    <circle cx="70" cy="42" r="5" fill="#00ff9c">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="86" y="47" fill="#00ff9c">LIVE FEED</text>
    <text x="200" y="47" fill="#6b7a99">//  SPLUNK ENTERPRISE  //  EVENTS INDEXED: ∞</text>
  </g>

  <!-- title -->
  <text x="60" y="122" font-family="'Segoe UI', 'Arial Black', Verdana, sans-serif" font-size="60" font-weight="800"
        fill="url(#title)" filter="url(#glow)" textLength="800" lengthAdjust="spacingAndGlyphs">SIEM INVESTIGATIONS</text>
  <text x="62" y="162" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#9fb3d9"
        textLength="800" lengthAdjust="spacing">SPLUNK  ×  LOG ANALYSIS  ×  THREAT HUNTING  ×  DFIR</text>

  <!-- terminal -->
  <rect x="60" y="200" width="800" height="56" rx="8" fill="#070b16" stroke="#00ff9c" stroke-opacity="0.55"/>
  <circle cx="78" cy="214" r="3.5" fill="#ff5f56"/>
  <circle cx="92" cy="214" r="3.5" fill="#ffbd2e"/>
  <circle cx="106" cy="214" r="3.5" fill="#27c93f"/>
  <text x="80" y="244" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#00ff9c">spl&gt;</text>
  <g clip-path="url(#typeclip)">
    <text x="130" y="244" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#e6edf7">index=* | stats count by host | sort - count</text>
  </g>

  <!-- radar -->
  <g transform="translate(1020 140)">
    <g fill="none" stroke="#00c8ff" stroke-opacity="0.4">
      <circle r="30"/>
      <circle r="60"/>
      <circle r="90"/>
      <line x1="-100" y1="0" x2="100" y2="0"/>
      <line x1="0" y1="-100" x2="0" y2="100"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <path d="M0 0 L90 0 A90 90 0 0 1 63.6 63.6 Z" fill="url(#sweepg)"/>
      <line x1="0" y1="0" x2="90" y2="0" stroke="#00ff9c" stroke-width="2"/>
    </g>
    <circle cx="40" cy="-32" r="4" fill="#ff3b6b">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;1" dur="4s" begin="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-48" cy="30" r="4" fill="#ffd166">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;1" dur="4s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="52" r="4" fill="#00ff9c">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;1" dur="4s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#00ff9c"/>
  </g>
  <text x="1020" y="262" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="3" fill="#6b7a99">THREAT SWEEP</text>

  <!-- scan line -->
  <rect x="-60" y="0" width="60" height="300" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1260 0" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
